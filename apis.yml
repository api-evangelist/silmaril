apis:
- name: Silmaril Firewall API
  description: >-
    AI application firewall classify API. A Firewall client sends each sanitized
    classification input (user input, tool response, model output, or system
    prompt) with a hook label and optional tool name to a tenant-issued classify
    endpoint, and receives a prediction (BENIGN/MALICIOUS), a primary outcome,
    and score/threshold data. Credentials and the classify endpoint are issued
    by Silmaril (not self-serve). A companion hosted, read-only MCP evidence
    server exposes firewall findings to agents.
  humanURL: https://silmaril.dev/docs
  baseURL: https://firewall-mcp.silmaril.dev

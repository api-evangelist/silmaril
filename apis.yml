aid: silmaril
name: Silmaril
description: >-
  Silmaril is a Y Combinator-backed runtime security company that builds an AI
  application firewall for agentic systems. The Silmaril Firewall classifies
  prompts, retrieved context, tool calls, tool responses, model output, and
  accumulated execution state before harmful outcomes materialize, returning a
  benign/malicious prediction plus a primary-outcome classification across
  secret exposure, information disclosure, control abuse, system compromise, and
  service disruption. It ships first-party TypeScript, Python, Go, and Java
  SDKs, LiteLLM and Vercel AI gateway guardrails, LangChain/LangGraph handlers,
  and agent plugins for Codex, Claude Code, OpenClaw, and Hermes, plus a hosted
  read-only MCP evidence server. Offered as managed and customer-controlled
  self-hosted container deployments.
